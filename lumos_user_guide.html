let role='student',cursor=0,journey=[];
const positions={student:0,teacher:0};
const el=id=>document.getElementById(id);
function chooseRole(value){positions[role]=cursor;role=value;journey=screens.flatMap((s,i)=>s.role==='both'||s.role===role?s.walk.map((step,n)=>({screen:s,screenIndex:i,step,number:n+1})):[]);cursor=Math.min(positions[role],journey.length-1);render();}
function render(){const item=journey[cursor],s=item.screen,step=item.step;
el('previous').textContent=cursor?journey[cursor-1].step.text:'Bắt đầu hành trình: mở trang Đăng nhập của Lumos.';
el('currentLabel').textContent='Bước hiện tại · '+(cursor+1);el('title').textContent=s.title;el('action').textContent=step.text;
if(item.screenIndex===0&&item.number===1)el('action').textContent='Nhập '+(role==='student'?'demo@lab029s.app':'teacher@lab029s.app')+' vào ô Email.';
el('result').textContent=step.after;el('next').textContent=cursor+1<journey.length?journey[cursor+1].step.text:'Bạn đã xem hết hướng dẫn dành cho '+(role==='student'?'Student':'Teacher')+'.';
const image=el('image');if(image.getAttribute('src')!==s.image)image.src=s.image;image.alt=s.title;
const [x,y,w,h]=step.box,[iw,ih]=s.size;
el('overlay').innerHTML='<div class="bounding" style="left:'+x/iw*100+'%;top:'+y/ih*100+'%;width:'+w/iw*100+'%;height:'+h/ih*100+'%"><span>'+(cursor+1)+'</span></div>';
el('caption').textContent=s.title+' · Bước '+item.number+'/'+s.walk.length;
el('position').textContent=(role==='student'?'Student':'Teacher')+' · '+(cursor+1)+' / '+journey.length;
el('transition').textContent=cursor===journey.length-1?'Đã đến cuối hướng dẫn':journey[cursor+1].screenIndex!==item.screenIndex?'Mũi tên phải: chuyển sang màn hình tiếp theo':'Mũi tên phải: xem thao tác kế tiếp';
el('bar').style.width=(cursor+1)/journey.length*100+'%';el('back').disabled=cursor===0;el('forward').disabled=cursor===journey.length-1;
const reveal=()=>{const pane=el('imageScroll'),height=el('stage').clientHeight;pane.scrollTop=Math.max(0,(y+h/2)/ih*height-pane.clientHeight/2);};
image.onload=reveal;requestAnimationFrame(reveal);
el('stage').classList.remove('enter');requestAnimationFrame(()=>el('stage').classList.add('enter'));
}
function move(delta){cursor=Math.max(0,Math.min(journey.length-1,cursor+delta));positions[role]=cursor;render();}
el('back').onclick=()=>move(-1);el('forward').onclick=()=>move(1);
document.querySelectorAll('input[name="role"]').forEach(r=>r.addEventListener('change',()=>chooseRole(r.value)));
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1);}});
chooseRole('student');
</script></body></html>
